<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <!-- Silhueta neon: roteador compacto com antenas laterais (forma geral, desenhada para o aurora-glass) -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#2d8cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <rect x="76" y="82" width="88" height="50" rx="12"/>
    <path d="M90 82 L70 46"/>
    <path d="M150 82 L170 46"/>
    <circle cx="70" cy="44" r="3"/>
    <circle cx="170" cy="44" r="3"/>
    <path d="M92 108 H148" stroke="#7fc4ff" stroke-width="1.6"/>
    <circle cx="136" cy="118" r="3" fill="#2d8cff"/>
  </g>
</svg>
