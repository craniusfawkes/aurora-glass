<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <!-- Silhueta neon: roteador alto com antena central (forma geral, desenhada para o aurora-glass) -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#2d8cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <rect x="92" y="44" width="56" height="92" rx="14"/>
    <path d="M120 44 V14"/>
    <circle cx="120" cy="12" r="3"/>
    <path d="M104 80 H136 M104 96 H136" stroke="#7fc4ff" stroke-width="1.6"/>
    <circle cx="120" cy="120" r="3" fill="#2d8cff"/>
  </g>
</svg>
